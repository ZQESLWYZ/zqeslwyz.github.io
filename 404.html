<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Yizhao Wang</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
<script>
(function () {
  try {
    var saved = localStorage.getItem('theme');
    var sys = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', saved || sys);
  } catch (e) { /* default theme */ }
})();
</script>
</head>
<body>
<main class="section" style="border-top:0">
  <div class="wrap" style="padding-top:48px">
    <p class="hero-eyebrow">Error 404</p>
    <h1 class="hero-name" style="font-size:2.2rem">Page not found</h1>
    <p class="hero-tagline">That URL does not exist on this site. It may have been renamed or never uploaded.</p>
    <div class="hero-cta">
      <a class="btn btn-primary" href="/">Back to homepage</a>
      <a class="btn" href="/#publications">Publications</a>
    </div>
  </div>
</main>
</body>
</html>
